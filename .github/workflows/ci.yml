name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.20,<6" "peft>=0.21" accelerate huggingface_hub tokenizers pillow numpy \
                      fastapi uvicorn httpx pytest
      - name: Tiny end-to-end tests (no downloads)
        run: pytest -q tests
